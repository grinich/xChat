name: Release

# Tag a version and everything else is automatic: build, test, GitHub Release, and an
# update submitted to the Chrome Web Store for review.
#
#   npm version patch     # bumps package.json, commits, tags, pushes (see package.json)
#
# Or run manually from the Actions tab to dry-run the store credentials without releasing.
# Setup + gotchas: docs/RELEASING.md
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check store credentials — no upload, no submit, no release'
        type: boolean
        default: true

permissions:
  contents: read # checkout; the build job escalates to write for the Release

concurrency:
  # Never let two submissions race for the same store item.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public — it's in every store URL, and wxt.config.ts pins the matching key.
  # A fork can override with an Actions variable.
  CHROME_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID || 'oaejnakkgghcgpekgdoffnpobkhnmlfm' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload the zip
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall (`wxt prepare`), which generates .wxt types.
      - run: npm ci

      # Make the tag (e.g. v0.2.0) drive the manifest version (read from package.json).
      # `npm version` already did this locally; this covers hand-pushed tags.
      #
      # `npm pkg set`, NOT `npm version`: the latter runs package.json's preversion/postversion
      # hooks, and postversion does `git push --follow-tags`, which dies on CI's detached-HEAD
      # checkout ("You are not currently on a branch").
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Typecheck
        run: npm run compile

      - name: Test
        run: npm test

      # `wxt zip` builds the production extension and zips it to dist/*.zip
      - name: Build + zip
        run: npm run zip

      # The tag is the only version source, so prove the artifact actually carries it —
      # a mismatch would ship a version nobody asked for.
      - name: Check the built version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built=$(node -p "require('./dist/manifest.json').version")
          want="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$want" ]; then
            echo "::error::manifest version $built does not match tag $want"
            exit 1
          fi
          echo "manifest version $built matches tag $want"

      - name: Upload zip as build artifact
        uses: actions/upload-artifact@v5
        with:
          name: xchat-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Chrome Web Store submit. Needs three repo secrets — CWS_CLIENT_ID,
  # CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN. Mint them in one shot with
  # `node scripts/cws-token.mjs --set-secrets` (see docs/RELEASING.md).
  # ---------------------------------------------------------------------------
  publish-chrome:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: xchat-extension
          path: dist

      # Fail with instructions rather than silently "succeeding" without submitting.
      - name: Check store credentials are configured
        env:
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          missing=()
          [ -n "$CHROME_CLIENT_ID" ]     || missing+=(CWS_CLIENT_ID)
          [ -n "$CHROME_CLIENT_SECRET" ] || missing+=(CWS_CLIENT_SECRET)
          [ -n "$CHROME_REFRESH_TOKEN" ] || missing+=(CWS_REFRESH_TOKEN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secret(s): ${missing[*]}. Run 'node scripts/cws-token.mjs --set-secrets' — see docs/RELEASING.md."
            exit 1
          fi

      # Resolve the single zip explicitly; a glob that matches nothing would otherwise be
      # passed through literally and fail deep inside the upload.
      - name: Locate the zip
        run: |
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::expected exactly one zip in dist/, found ${#zips[@]}"
            exit 1
          fi
          echo "CHROME_ZIP=${zips[0]}" >> "$GITHUB_ENV"
          echo "Submitting ${zips[0]}"

      # Uploads the new version and submits it for review (publishes once approved).
      # On a manual dry run this only verifies auth — nothing is uploaded.
      - name: Submit to Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx wxt submit ${{ inputs.dry_run && '--dry-run' || '' }}

      # Deliberately not `if: always()` — a summary claiming "submitted" after a failed
      # submit would lie.
      - name: Summarize
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "### Chrome Web Store credential check"
              echo "Auth verified against \`$CHROME_EXTENSION_ID\` — nothing was uploaded."
            else
              echo "### Submitted to the Chrome Web Store"
              echo "\`$CHROME_ZIP\` uploaded and submitted for review."
              echo ""
              echo "Review takes hours to a few days; the update publishes automatically on approval."
              echo "[Listing](https://chromewebstore.google.com/detail/$CHROME_EXTENSION_ID) · [Dashboard](https://chrome.google.com/webstore/devconsole)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
